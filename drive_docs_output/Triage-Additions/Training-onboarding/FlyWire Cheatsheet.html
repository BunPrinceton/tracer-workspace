Basic Navigation 
 
 
 
 
 
 
Center something in any image panel: right click on it. 
(On a Mac trackpad, two-finger click.) 
 
 
 
 
 
 
 
 
 
Zoom: hover over one image panel and ctrl + mouse 
wheel (on trackpads, slide two fingers apart.) 
 
 
 
 
 
 
 
 
 
 
 
 
Move between slices: hover over EM image panel and 
use mouse wheel (or comma and period keys)</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='FlyWire Cheatsheet_assets/page-002.png' alt='page 2' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 2 of 6</figcaption><details><summary>Page text</summary><pre>Select a cell: double click that cell in the 2D (left) view 
 
Deselect a cell: double click that cell in any view 
 
 
 
 
 
 
 
 
 
 
 
 
Rotate 3D view: click + drag (rotates around the point 
you’re centered at) 
 
 
 
 
 
 
 
 
 
 
 
Pan in EM image (2D) panel: click + drag</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='FlyWire Cheatsheet_assets/page-003.png' alt='page 3' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 3 of 6</figcaption><details><summary>Page text</summary><pre>Pan in 3D panel: shift click + drag 
 
 
 
 
Snap to axes: z (snaps only to nearest axes. In Germany, keyboards may use y instead.) Looking at 
upright, frontal view of the brain when green axis is pointing down, red pointing to right. 
Rotate 2D view: shift click + drag (not recommended; it rotates the whole image stack. To get back 
to a face-on (XY) view, shift click + drag until pretty close to having green axis pointing down, 
red axis pointing right, then hit z to snap to axes) 
Select layout (XY, XZ, YZ, 3D): spacebar, or box icons  
in upper right of image panel 
Hide/reveal tab: left click on tab  
at top left or type its number 
(e.g. “1”) 
Delete tab: click x on tab 
Undo delete tab: click Undo in message that appears at bottom 
left of screen after a tab was deleted 
Activate layer: right click layer’s tab at top left of screen 
Show/hide layer’s functions (right menu): right click on 
layer’s tab at top left of screen 
Copy coordinates: “copy” icon 
to left of coordinates at top left 
Edit coordinates: click in coordinates box 
and type or paste 
 
Show/hide colored axis lines: a 
 
Center view on a desired location: right click location</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='FlyWire Cheatsheet_assets/page-004.png' alt='page 4' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 4 of 6</figcaption><details><summary>Page text</summary><pre>Refresh view: browser’s refresh button

Splitting &amp; merging 
In the Production Dataset, please edit responsibly - only make cuts or merges if you are confident of 
the right answer. In the Sandbox, you can play around, and split and merge cells however you want.  
Check where two cells may have been accidentally merged (one approach):  
●​ Right click on segmentation layer’s tab at top left if it’s not already activated. 
●​ Select Graph tab at top right. 
●​ Under “Find Path”, select small dot 
●​ Ctrl click to place one point in each of the two cells  
●​ Click check mark icon to find shortest path 
Merge two segments: hit m, click first segment, click second segment (in either 2D or 3D) 
Cut two segments apart:  
●​ Right click on segmentation layer’s tab at top left if it’s not already activated. 
●​ Select Graph tab at top right.  
●​ Under “Multicut”, click Set split point icon (small dot).  
●​ Ctrl click to place a point on the cell, repeat to place 
enough points to define one side of the cut.  
●​ Click Toggle Multi-cut Group icon (blue &amp; red circles) to switch to other point type.  
●​ Ctrl click and place multiple points in the other part of the cell, to be cut away.  
●​ Click check mark icon to implement cut. 
●​ Click x to delete points. 
Quick hack to cut two points apart (software may not be able to find an obvious cut): hit c, click first 
segment, click second segment 
Redraw 3D view after an edit: refresh browser 
Undo an edit: there is currently no undo button, but if you cut two things apart accidentally, you can 
merge them once again, or if you merged them accidentally, you can cut them once again.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='FlyWire Cheatsheet_assets/page-006.png' alt='page 6' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 6 of 6</figcaption><details><summary>Page text</summary><pre>For Fun: Hit the L key to randomly recolor your meshes</pre></details></figure><script src="../../../search.js" defer></script>
