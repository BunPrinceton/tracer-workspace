Indicators 
 
●​ Synapses have four possible indicators: one primary, and three secondary. 
○​ Dense cluster of vesicles  
○​ Synaptic cleft 
○​ T-bar 
○​ PSD 
●​ For a synapse to be vetted, the primary indicator (i.e. dense vesicles) must be present, 
as well at least two of the secondary indicators. 
●​ What follows is a how-to guide on how to recognize and annotate synapses in fly data.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='How to Fly Synapse_assets/page-002.png' alt='page 2' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 2 of 15</figcaption><details><summary>Page text</summary><pre>2 
Shapes 
 
Just as in previous mammalian or fish data, fly synapses comprise a presynaptic axonal body 
and a postsynaptic dendritic or axonal body. Spines branch off from large dendritic bodies and 
into spine-heads to come up against and receive information from axons. Large, non-spine, 
dendritic bodies as well as large axonal bodies can also facilitate synapses. In previous 
datasets, we are used to seeing axons with relatively clear trajectories, swelling and shrinking 
as they move from one side of the bounding box to another, and moderate to large dendrites 
with clear spines. In fly data, we see something a little different.  
 
 
Fig.1: Large shot. 
 
In Fig. 1 we see a congregation of amorphously shaped axons, dendrites and multicellular 
bodies. Axons are generally large sweeping structures that branch and pinch as they move 
throughout the set. Dendritic branches can be just as large and sweeping, often looking very 
similar in form to the axons around them. What is distinct here are the shapes of the spine 
heads and the way they interact with axons. In previous datasets, spines could often look 
identical to non-bouton sections of axons, both appearing as small circular shapes in EM. In fly, 
by contrast, spines seem to be the only objects that take on a small circular shape. They are 
often grouped together and surround axons from many sides and in large numbers.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='How to Fly Synapse_assets/page-003.png' alt='page 3' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 3 of 15</figcaption><details><summary>Page text</summary><pre>3 
 
Fig. 2: Cluster of dendritic spines. 
 
Fig. 3: Cluster of synapsing spin heads.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='How to Fly Synapse_assets/page-004.png' alt='page 4' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 4 of 15</figcaption><details><summary>Page text</summary><pre>4

Synaptic Clefts/Gaps 
 
Aside from dense clusters of vesicles, widened synaptic clefts/gaps should be the easiest to 
spot. While PSDs can often look identical to a general border, clefts in fly data comprise what 
often appears as a thin sliver of space between the presynaptic axonal body and the 
postsynaptic dendritic body. Because the gaps are predominantly thin, the darkness of its 
borders and the activity of the synapse bleeds over, making these areas dark and relatively 
easy to spot. Below are some examples. Clefts are the foremost indicator of synapses in fly, and 
there are common cases where the only indicator that two bodies are synapsing is that they are 
both touching the same cleft. 
 
 
Fig. 1 &amp; 2: Clear example of a cleft in sequential slides.
 
Fig. 3: Multiple clefts.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='How to Fly Synapse_assets/page-008.png' alt='page 8' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 8 of 15</figcaption><details><summary>Page text</summary><pre>8

Postsynaptic Density 
 
The postsynaptic density is a dark or shaded area that appears in the dendritic body at a 
synapse point. In previous datasets, this indicator has been relatively prominent and easy to 
spot, but in fly data its prominence varies. Below are some examples, starting with a few that 
are more apparent, followed by some that are a little harder to see. 
 
 
Fig. 1: Prominent PSD. Notice how the membrane on the postsynaptic side of the cleft 
bumps up in places, indicating an area of darkness beyond the parameters of the 
membrane.  
 
 
Fig. 2: Mixed prominency PSD. Notice how the PSD of the three dendrites on the left look 
similar to those in Fig. 1, while the two on the right are less prominent.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='How to Fly Synapse_assets/page-011.png' alt='page 11' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 11 of 15</figcaption><details><summary>Page text</summary><pre>11

Tracing Method 
 
Now that we’ve outlined what each of the indicators looks like and how they can be identified, 
we can move onto what the annotation process is like. Once a synapse is located and 
confirmed, annotating the parts involved is a quick and easy process. There are annotation 4 
categories, and therefore 4 different segments should be used: Cleft/Gap/PSD, T-bar, Uncertain 
Cleft/Gap/PSD, Uncertain T-bar. The two uncertain categories are self explanatory: if you are 
uncertain about either a cleft or a T-bar, you mark it with the appropriate uncertain segment 
color.  
 
Fig. 1: Segment tree. 
 
Clefts that you are certain of should be annotated with a simple line that extends the length of 
the cleft. as follows:</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='How to Fly Synapse_assets/page-013.png' alt='page 13' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 13 of 15</figcaption><details><summary>Page text</summary><pre>13 
 
Fig. 2: Annotated Cleft. Arrows indicate the end points of the cleft. 
 
You do not need to worry about covering all of the pixels that make up the cleft, or even 
changing the size of the brush to match the thickness of the cleft, but attention should be paid to 
prevent extending the length of the annotation to include membrane that isn’t part of the 
synapse. Below are two comparative Fig.s: One that demonstrates over-segmentation of clefts, 
and one that demonstrates correct segmentation. 
 
 
Fig. 3: Over-segmentation/bridging distance between clefts. 
 
Fig. 4: Correct Segmentation.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='How to Fly Synapse_assets/page-014.png' alt='page 14' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 14 of 15</figcaption><details><summary>Page text</summary><pre>14 
T-bars should be annotated by replicating the shape of the T-bar regardless of shape. As 
mentioned earlier in this document, sometimes T-bars actually look like a T, but often they are 
various shapes. Either way, it’s important to replicate that shape within reason. The annotation 
does not have to be pixel perfect. 
 
 
Fig. 5: T-bar annotation.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='How to Fly Synapse_assets/page-015.png' alt='page 15' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 15 of 15</figcaption><details><summary>Page text</summary><pre>15 
 
Top-Down/Surfacing synapses 
 
There’s a fair chance that the majority of synapses that you will encounter will be lateral, as all 
previous examples in this document have been. But sometimes you will come upon synapses 
that are more vertical. These instances involve progressing through the the Z plane to uncover 
the cleft and T-bar that are revealed once the postsynaptic bodies have moved out of the way, 
kind of like digging in the sand. 
 
Fig. 6: Top-down synapse. The postsynaptic dendritic bodies are marked here in green. Notice how they disperse as 
the axon comes up from below. Can you spot the cleft and T-bar? 
 
   
Fig. 7: Top-down synapse with cleft and T-bar labeled.</pre></details></figure></body></html>
