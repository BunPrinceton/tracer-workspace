Step 1: Open sheet.
Step 2: Find an index with ‘0’ in BOTH the ‘comparison_root_id_latest’ and ‘comparison_root_id’ columns. (Starts at index 484)
Step 3: Put your name(first) and date(after competition) in column ‘M’ and ‘N’ respectively.
Step 4: Open the hyperlink from ‘K’ column.
Step 4a: Deselect and reselect the segment you are proofreading to ensure you have an updated segment.
Step 5: Begin proofreading. Try to only spend 20-45 mins per cell - Unless it’s quite large and needs more time.
Step 6: Once you have proofread all you can, use columns ‘P’ and ‘Q’ to select the drop down choices that match.
P Column Choices
‘Proofreading needed’: Cell needed proofreading. (likely the case)
‘Not a good match (Cells are from different types)’: Please do NOT use this tag since there will only be one cell to proofread.
‘Can&#x27;t find any proofreading error’: If there are no errors to fix.
Q Column Choices
‘Done’: When you’re finished proofreading.
‘No need for proofreading’: Cell didn’t need proofreading.
‘Need 2nd opinion_proofreading’: Cell has a tough to resolve issue. (Note there is a similar tag “Need 2nd opinion_not sure a good match”. 
Please do NOT mix up with this one)
‘Can&#x27;t fix (left)’ or ‘Can’t fix (right)’: If you’re cell has a major issue that prevents proofreading label it with the appropriate side ‘Can’t Fix’ 
Label.
Step 7: Share your final link in the ‘O’ column.
Step 8: Mark &quot;backbone proofread&quot; in banc-bot.</pre></details></figure><figure style='margin:0 0 1.5rem;'><img src='AN-DN Task Guide_assets/page-002.png' alt='page 2' style='width:100%;border:1px solid #d4d4d4;border-radius:6px;'/><figcaption style='color:#737373;font-size:12px;margin:.25rem 0;'>Page 2 of 3</figcaption><details><summary>Page text</summary><pre>Which side is my Neuron on?

-Place the mesh like this with the bottom half

-If your cell is on the right side of the mesh it’s
